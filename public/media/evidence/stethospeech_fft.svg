<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="grad-slate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="540" fill="#f8fafc" rx="12" />
  <rect x="20" y="20" width="880" height="500" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="8" />

  <!-- Title -->
  <text x="460" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Phase 4B Experimental Architecture: StethoSpeech Feed-Forward Transformer</text>
  <text x="460" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">29,263,360 Parameters (Base) • FastSpeech2-derived FFT Blocks • 1D Convolutions (k=[9, 1])</text>

  <!-- Block 1: Input -->
  <g transform="translate(60, 115)">
    <rect width="180" height="65" rx="8" fill="url(#grad-indigo)" filter="url(#shadow2)" />
    <text x="90" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">mHuBERT L11 Input</text>
    <text x="90" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#e0e7ff" text-anchor="middle">Shape: (B, T, 768)</text>
  </g>

  <!-- Arrow -->
  <path d="M 240 147 L 290 147" stroke="#94a3b8" stroke-width="2" fill="none" />
  <polygon points="290,147 282,142 282,152" fill="#94a3b8" />

  <!-- Block 2: Proj In -->
  <g transform="translate(300, 115)">
    <rect width="170" height="65" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow2)" />
    <text x="85" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Linear + ReLU</text>
    <text x="85" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">768 → 256 + Sinusoid PE</text>
  </g>

  <!-- Arrow -->
  <path d="M 470 147 L 520 147" stroke="#94a3b8" stroke-width="2" fill="none" />
  <polygon points="520,147 512,142 512,152" fill="#94a3b8" />

  <!-- Block 3: FFT Encoder -->
  <g transform="translate(530, 100)">
    <rect width="210" height="95" rx="8" fill="url(#grad-teal)" filter="url(#shadow2)" />
    <text x="105" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">FFT Encoder (6 Layers)</text>
    <text x="105" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#ccfbf1" text-anchor="middle">Multihead Attention (2 heads)</text>
    <text x="105" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#ccfbf1" text-anchor="middle">1D Conv (k=9, d=1024) + (k=1)</text>
    <text x="105" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#99f6e4" text-anchor="middle">17,321,472 parameters</text>
  </g>

  <!-- Branch: Auxiliary CTC Head (Dotted) -->
  <path d="M 635 195 L 635 240 L 710 240" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,4" fill="none" />
  <polygon points="710,240 702,235 702,245" fill="#f43f5e" />

  <g transform="translate(720, 215)">
    <rect width="160" height="60" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5" />
    <text x="80" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#9f1239" text-anchor="middle">Auxiliary CTC Head</text>
    <text x="80" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#e11d48" text-anchor="middle">256 → 768 → 32 logits</text>
    <text x="80" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-style="italic" fill="#be123c" text-anchor="middle">(Decoupled in Executed Loss)</text>
  </g>

  <!-- Path from Encoder to Decoder -->
  <path d="M 635 195 L 635 300 L 520 300" stroke="#94a3b8" stroke-width="2" fill="none" />
  <polygon points="520,300 528,295 528,305" fill="#94a3b8" />

  <!-- Block 4: FFT Decoder -->
  <g transform="translate(300, 255)">
    <rect width="210" height="95" rx="8" fill="url(#grad-teal)" filter="url(#shadow2)" />
    <text x="105" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">FFT Decoder (4 Layers)</text>
    <text x="105" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#ccfbf1" text-anchor="middle">Multihead Attention (2 heads)</text>
    <text x="105" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#ccfbf1" text-anchor="middle">1D Conv (k=9, d=1024) + (k=1)</text>
    <text x="105" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#99f6e4" text-anchor="middle">11,547,648 parameters</text>
  </g>

  <!-- Arrow Left to Out Proj -->
  <path d="M 300 300 L 250 300" stroke="#94a3b8" stroke-width="2" fill="none" />
  <polygon points="250,300 258,295 258,305" fill="#94a3b8" />

  <!-- Block 5: Proj Out -->
  <g transform="translate(60, 268)">
    <rect width="180" height="65" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow2)" />
    <text x="90" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Linear Output Proj</text>
    <text x="90" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">256 → 768 (197,376 params)</text>
  </g>

  <!-- Path Down to Vocoder -->
  <path d="M 150 333 L 150 400 L 260 400" stroke="#94a3b8" stroke-width="2" fill="none" />
  <polygon points="260,400 252,395 252,405" fill="#94a3b8" />

  <!-- Block 6: Phase 5 Vocoder Integration -->
  <g transform="translate(270, 370)">
    <rect width="360" height="60" rx="8" fill="url(#grad-slate)" filter="url(#shadow2)" />
    <text x="180" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Phase 5: Unit HiFi-GAN Vocoder (320x Upsampling)</text>
    <text x="180" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">mHuBERT L11 km1000 Tokens → 16kHz Waveform (13,375,809 params)</text>
  </g>

  <!-- Footer notice -->
  <text x="460" y="485" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Historical State: ~2 Preliminary Epochs Trained • Session Interrupted by Kaggle Timeout • CTC Loss Decoupled</text>
  <text x="460" y="505" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Reference Paper: Neil Shah et al., ACM IMWUT 8(3), 2024 (DOI: 10.1145/3678515)</text>
</svg>
