<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="480" fill="#f8fafc" rx="12" />
  <rect x="20" y="20" width="810" height="440" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="8" />

  <!-- Title -->
  <text x="425" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Phase 4A Baseline Architecture: 6-Layer Transformer Encoder</text>
  <text x="425" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">19,702,016 Trainable Parameters • Evaluated Test MAE: 0.23171 (1,133 held-out utterances)</text>

  <!-- Block 1: Input -->
  <g transform="translate(60, 120)">
    <rect width="200" height="70" rx="8" fill="url(#grad-blue)" filter="url(#shadow)" />
    <text x="100" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">NAM Feature Input</text>
    <text x="100" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#dbeafe" text-anchor="middle">Shape: (B, T_nam, 768)</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 260 155 L 320 155" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <polygon points="320,155 312,150 312,160" fill="#94a3b8" />

  <!-- Block 2: Proj In + PE -->
  <g transform="translate(330, 120)">
    <rect width="200" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)" />
    <text x="100" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">Linear Input Projection</text>
    <text x="100" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">768 → 512 + Sinusoidal PE</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 530 155 L 590 155" stroke="#94a3b8" stroke-width="2" fill="none" />
  <polygon points="590,155 582,150 582,160" fill="#94a3b8" />

  <!-- Block 3: Transformer Stack -->
  <g transform="translate(600, 105)">
    <rect width="200" height="100" rx="8" fill="url(#grad-purple)" filter="url(#shadow)" />
    <text x="100" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Transformer Encoder ×6</text>
    <text x="100" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#ede9fe" text-anchor="middle">d_model=512 • 8 Heads</text>
    <text x="100" y="73" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#ede9fe" text-anchor="middle">dim_feedforward=2048</text>
    <text x="100" y="90" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#c4b5fd" text-anchor="middle">Dropout = 0.1</text>
  </g>

  <!-- Connecting Path Down -->
  <path d="M 700 205 L 700 260 L 590 260" stroke="#94a3b8" stroke-width="2" fill="none" />
  <polygon points="590,260 598,255 598,265" fill="#94a3b8" />

  <!-- Block 4: Proj Out -->
  <g transform="translate(380, 225)">
    <rect width="200" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)" />
    <text x="100" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">Linear Output Projection</text>
    <text x="100" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">512 → 768</text>
  </g>

  <!-- Arrow Left -->
  <path d="M 380 260 L 320 260" stroke="#94a3b8" stroke-width="2" fill="none" />
  <polygon points="320,260 328,255 328,265" fill="#94a3b8" />

  <!-- Block 5: Temporal Interpolation -->
  <g transform="translate(110, 225)">
    <rect width="200" height="70" rx="8" fill="url(#grad-amber)" filter="url(#shadow)" />
    <text x="100" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Temporal Interpolation</text>
    <text x="100" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#fef3c7" text-anchor="middle">F.interpolate (T_nam → T_speech)</text>
  </g>

  <!-- Connecting Path Down to Loss -->
  <path d="M 210 295 L 210 350 L 320 350" stroke="#94a3b8" stroke-width="2" fill="none" />
  <polygon points="320,350 312,345 312,355" fill="#94a3b8" />

  <!-- Block 6: Objective -->
  <g transform="translate(330, 320)">
    <rect width="320" height="60" rx="8" fill="url(#grad-emerald)" filter="url(#shadow)" />
    <text x="160" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Objective: Masked L1 Loss (MAE)</text>
    <text x="160" y="47" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#d1fae5" text-anchor="middle">Computed strictly on unpadded frames</text>
  </g>

  <!-- Ground Truth Speech Input -->
  <path d="M 750 350 L 660 350" stroke="#94a3b8" stroke-width="2" fill="none" />
  <polygon points="660,350 668,345 668,355" fill="#94a3b8" />
  <text x="755" y="354" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748b" text-anchor="start">Target Speech (B, T_speech, 768)</text>

  <!-- Footer status -->
  <text x="425" y="435" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">Status: Fully Trained (45 Epochs) • Selected: Epoch 35 Checkpoint • EarlyStopping(patience=10, delta=0.001)</text>
</svg>
